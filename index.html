<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />

    <title>MX OffRoad Mountain Bike</title>

    <style>
      html, body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: black;
        width: 100%;
        height: 100%;
      }

      canvas {
        width: 100%;
        height: 100%;
        display: block;
      }
    </style>
  </head>

  <body>
    <canvas id="unity-canvas"></canvas>

    <script>
      var buildUrl = "Build";

      var config = {
        dataUrl: buildUrl + "/bike.data.unityweb",
        frameworkUrl: buildUrl + "/bike.framework.js.unityweb",
        codeUrl: buildUrl + "/bike.wasm.unityweb",

        streamingAssetsUrl: "StreamingAssets",
        companyName: "Unity",
        productName: "MX OffRoad Mountain Bike",
        productVersion: "1.0",

        // 🔥 IMPORTANT FIXES
        devicePixelRatio: 1, // prevents huge RenderTextures

        // You can reduce memory if needed:
        // memorySize: 512 * 1024 * 1024
      };

      const canvas = document.querySelector("#unity-canvas");

      function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }

      window.addEventListener("resize", resizeCanvas);
      resizeCanvas();

      // Load Unity loader
      var script = document.createElement("script");
      script.src = buildUrl + "/bike.loader.js";

      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          console.log("Loading: " + (progress * 100) + "%");
        }).then((unityInstance) => {
          console.log("Unity loaded!");
        }).catch((message) => {
          console.error(message);
        });
      };

      document.body.appendChild(script);
    </script>
  </body>
</html>
